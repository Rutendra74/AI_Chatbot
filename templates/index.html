<!DOCTYPE html>
<html>
<head>
    <title>Chat with AI</title>

    <style>
        body{
            font-family:Arial, sans-serif;
            background:#f4f4f4;
            padding:20px;
        }

        .chat-box{
            max-width:700px;
            margin:auto;
            background:white;
            border-radius:10px;
            padding:20px;
            box-shadow:0px 0px 10px rgba(0,0,0,0.1);
        }

        h2{
            text-align:center;
        }

        .chat-container{
            height:60vh;
            overflow-y:auto;
            border:1px solid #ddd;
            padding:15px;
            border-radius:8px;
            margin-bottom:15px;
            background:#fafafa;
        }

        .user-msg{
            color:blue;
            font-weight:bold;
            margin-bottom:10px;
        }

        .bot-msg{
            color:green;
            font-weight:bold;
            margin-bottom:10px;
        }

        .upload-form{
            margin-bottom:15px;
            display:flex;
            gap:10px;
            align-items:center;
        }

        .input-container{
            display:flex;
            gap:10px;
        }

        input[type="text"]{
            flex:1;
            padding:10px;
        }

        button{
            padding:10px 20px;
            cursor:pointer;
        }
    </style>

</head>

<body>
    <nav class="navbar">
    
        <div class="nav-right">
            <a href="{{ url_for('logout') }}" class="logout-btn">
                Logout
            </a>
        </div>
    </nav>

<div class="chat-box">

    <h2>🤖 AI Chatbot</h2>

    <!-- Chat History -->
    <div class="chat-container">

        {% for role, message in rows %}

            {% if role=="User" %}
                <div class="user-msg">
                    {{ role }} : {{ message }}
                </div>

            {% elif role=="AI" %}
                <div class="bot-msg">
                    {{ role }} : {{ message }}
                </div>

            {% endif %}

        {% endfor %}

    </div>


    <!-- Upload PDF -->
    <form class="upload-form"
          action="/upload"
          method="POST"
          enctype="multipart/form-data">

        <input type="file"
               name="pdf_file"
               accept=".pdf"
               required>

        <button type="submit">
            📄 Upload PDF
        </button>

    </form>


    <!-- Chat Input -->
    <form method="POST">

        <div class="input-container">

            <input
                type="text"
                name="user_input"
                placeholder="Ask me anything..."
                required>

            <button type="submit">
                Send
            </button>

        </div>

    </form>

</div>

</body>
</html>
